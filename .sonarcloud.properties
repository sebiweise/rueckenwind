# Settings for SonarCloud's automatic analysis (https://sonarcloud.io/summary/overall?id=sebiweise_rueckenwind).
# Tests are analysed as tests, not as production code.
sonar.sources=src,scripts
sonar.tests=src,e2e
sonar.test.inclusions=src/**/*.spec.ts,e2e/**/*.e2e.ts
sonar.exclusions=src/**/*.spec.ts
