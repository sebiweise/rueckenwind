# Dependabot hält die GitHub Actions (auf Commit-SHAs gepinnt) und die npm-Pakete aktuell.
# Kleine Updates kommen gebündelt in einem PR pro Woche, große Versionen einzeln.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Versions-Updates warten eine Woche: gekaperte Releases sind meist nach
    # wenigen Tagen zurückgezogen. Sicherheitsupdates verzögert das nicht.
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: ci

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    ignore:
      # TypeScript 7 (nativer Compiler) wird von typescript-eslint noch nicht unterstützt,
      # der Lint-Schritt bricht damit ab. Major-Updates erst wieder zulassen, wenn
      # typescript-eslint TS 7 unterstützt (typescript-eslint/typescript-eslint#10940).
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: chore
      include: scope
