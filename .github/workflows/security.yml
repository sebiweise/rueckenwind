name: Security

# Sicherheits-Scan (Semgrep, Trivy, Gitleaks) aus sebiweise/security-workflows;
# nur schwere Funde lassen den Lauf scheitern, siehe dort die README.

on:
  pull_request:
  push:
    branches: [master]
  # Neue CVEs erscheinen auch für Code, der sich nicht geändert hat.
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    uses: sebiweise/security-workflows/.github/workflows/scan.yml@8b232b405b4b8a638b1bc5a17acb91980663eee5 # v1.1.0
