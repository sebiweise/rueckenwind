name: CI

on:
  push:
    branches: [master]
  pull_request:

# Lieferkette: Actions sind auf Commit-SHAs gepinnt (Dependabot hält sie aktuell, siehe
# .github/dependabot.yml). npm ci läuft mit --ignore-scripts: Install-Skripte von Paketen
# werden nicht ausgeführt. esbuild und unrs-resolver bringen ihre Binärdateien als
# optionale Pakete mit und brauchen ihr Skript nicht.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, Typecheck, Unit-Tests, Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run check
      - run: npm run test:coverage
      - run: npm run build

  e2e:
    name: E2E-Tests (Playwright + axe)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7

  lighthouse:
    name: Lighthouse (≥ 90)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Lighthouse gegen den statischen Export
        run: |
          PORT=4173 npm start &
          for i in $(seq 30); do curl -sf http://localhost:4173/ > /dev/null && break; sleep 1; done
          CHROME_PATH=$(node -e "console.log(require('@playwright/test').chromium.executablePath())") \
            node scripts/lighthouse.mjs http://localhost:4173/
