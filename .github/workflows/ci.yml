name: CI

on:
  push:
    branches: [master]
  pull_request:

# Lieferkette: Actions sind per Versions-Tag eingebunden (Dependabot hält sie aktuell, siehe
# .github/dependabot.yml). npm ci läuft mit --ignore-scripts: Install-Skripte von Paketen
# werden nicht ausgeführt. esbuild und unrs-resolver bringen ihre Binärdateien als
# optionale Pakete mit und brauchen ihr Skript nicht.
permissions:
  contents: read

# Gebaut wird hier wie für GitHub Pages (BASE_PATH=/<Repository-Name>, siehe pages.yml):
# Die E2E-Tests und Lighthouse prüfen genau den Export, der veröffentlicht wird.
# `next build` prüft dabei auch die Typen; Lint und `tsc` laufen im Job "check".
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, Typecheck, Unit-Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run check
      - run: npm run test:coverage

  e2e:
    name: E2E-Tests (Playwright + axe)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: ./node_modules/.bin/playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: true
          BASE_PATH: /${{ github.event.repository.name }}
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7

  lighthouse:
    name: Lighthouse (≥ 90)
    runs-on: ubuntu-latest
    env:
      BASE_PATH: /${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: ./node_modules/.bin/playwright install --with-deps chromium
      - run: npm run build
      - name: Lighthouse gegen den statischen Export
        run: |
          PORT=4173 npm start &
          for i in $(seq 30); do curl -sf "http://localhost:4173$BASE_PATH/" > /dev/null && break; sleep 1; done
          CHROME_PATH=$(node -e "console.log(require('@playwright/test').chromium.executablePath())") \
            node scripts/lighthouse.mjs "http://localhost:4173$BASE_PATH/"
