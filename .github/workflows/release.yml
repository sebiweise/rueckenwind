name: Release

# Ein Tag wie v0.1.0 erzeugt ein GitHub-Release mit dem passenden Abschnitt aus CHANGELOG.md
# und dem statischen Export als Zip.
# Ein Tag mit Zusatz wie v0.1.0-beta.1 wird als Vorabversion (Testversion) veröffentlicht
# und nutzt den CHANGELOG-Abschnitt der Version ohne Zusatz.
on:
  push:
    tags: ['v*']

# Bauen läuft ohne Schreibrecht: der Build führt Code aus Abhängigkeiten aus
# (npm ci selbst läuft mit --ignore-scripts, Actions sind gepinnt, siehe ci.yml).
# Nur der kleine Job "publish" bekommt contents: write und führt keinen Fremdcode aus.
permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: cd out && zip -qr "../rueckenwind-${GITHUB_REF_NAME}-static.zip" .
      - name: Release-Notizen aus CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          version="${version%%-*}"
          awk -v v="$version" '$0 ~ "^## \\[" v "\\]" {found=1; next} found && /^## \[/ {exit} found {print}' CHANGELOG.md > notes.md
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release
          path: |
            rueckenwind-${{ github.ref_name }}-static.zip
            notes.md
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release
      - name: Release anlegen
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes-file notes.md $prerelease "rueckenwind-${GITHUB_REF_NAME}-static.zip"
        env:
          GH_TOKEN: ${{ github.token }}
