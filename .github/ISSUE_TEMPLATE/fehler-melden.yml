name: Fehler melden
description: Etwas in der App funktioniert nicht wie erwartet.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Bitte keine persönlichen Gesundheitsdaten, Diagnosen oder Praxisnamen eintragen.** Alles hier ist öffentlich.
  - type: textarea
    id: what
    attributes:
      label: Was ist passiert?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Was hättest du erwartet?
  - type: textarea
    id: steps
    attributes:
      label: Schritte zum Nachstellen
      placeholder: |
        1. …
        2. …
  - type: input
    id: environment
    attributes:
      label: Gerät und Browser
      placeholder: z. B. Android 15, Firefox 140
