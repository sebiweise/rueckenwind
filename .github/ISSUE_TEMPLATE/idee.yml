name: Idee vorschlagen
description: Ein Vorschlag für eine neue Funktion oder Verbesserung.
labels: [idee]
body:
  - type: markdown
    attributes:
      value: |
        Rückenwind bleibt bewusst schlank: lokal-first, ohne Server, ohne Tracking und ohne Rechts- oder Medizinberatung. Ideen, die Daten nach außen senden würden, können wir leider nicht umsetzen.
  - type: textarea
    id: problem
    attributes:
      label: Welches Problem löst die Idee?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Wie stellst du dir die Lösung vor?
